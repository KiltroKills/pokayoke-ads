<!doctype html>
<html lang="en" data-ratio="16x9">
<head>
<meta charset="utf-8">
<title>pokayoke ad PKY-0006</title>
<script>
  const ratio = new URLSearchParams(location.search).get('ratio');
  if (['16x9', '4x5', '9x16'].includes(ratio)) document.documentElement.dataset.ratio = ratio;
</script>
<link rel="stylesheet" href="../../brand/tokens.css">
<!--
  Meme: Flex Tape (imgflip template 166969924, the same frames as the user's image), upscaled 2x to meme.jpg
  (1020x1144). The user asked for "Flag critical security issues." at the bottom: it is the meme's bottom text.
  Layouts: 16:9 meme left, panel right. 4:5 meme full width over a brand band. 9:16 hook, meme, brand band.
-->
<style>
  :root { --frame-w: 960px; --frame-h: 540px; }
  [data-ratio="4x5"] { --frame-w: 540px; --frame-h: 675px; }
  [data-ratio="9x16"] { --frame-w: 540px; --frame-h: 960px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--color-canvas); }
  body {
    width: var(--frame-w);
    height: var(--frame-h);
    font-family: var(--font-display);
    color: var(--color-ink);
    -webkit-font-smoothing: antialiased;
  }
  p, h1 { margin: 0; }

  .ad {
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    grid-template-rows: 100%;
    grid-template-areas: "meme panel";
  }
  [data-ratio="4x5"] .ad {
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "meme" "panel";
  }
  [data-ratio="9x16"] .ad {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "hook" "meme" "panel";
  }

  /* The meme and its bottom text, sized in the meme's own width (cqw) so it reads the same in every ratio */
  .meme { grid-area: meme; position: relative; container-type: inline-size; line-height: 0; }
  [data-ratio="16x9"] .meme { height: 100%; aspect-ratio: 1020 / 1144; }
  .meme img { width: 100%; height: auto; display: block; }
  [data-ratio="16x9"] .meme img { height: 100%; width: auto; }
  .caption {
    position: absolute;
    left: 50%;
    bottom: 3.5cqw;
    width: 92%;
    transform: translateX(-50%);
    text-align: center;
    text-wrap: balance;
    font-size: 8cqw;
    font-weight: 900;
    letter-spacing: 0.01em;
    line-height: 1.04;
    color: var(--color-surface);
    -webkit-text-stroke: 0.9cqw var(--color-ink);
    paint-order: stroke fill;
    text-shadow: 0 0.4cqw 1.2cqw color-mix(in srgb, var(--color-ink) 45%, transparent);
  }

  /* Hook, line and lockup. The hook sits above the meme in 9:16 and inside the panel in 16:9. */
  .ad > .hook { display: none; }
  [data-ratio="9x16"] .ad > .hook { display: block; }
  .hook {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -1.8px;
    line-height: 1.02;
    text-wrap: balance;
  }
  [data-ratio="9x16"] .hook {
    grid-area: hook;
    padding: var(--space-40) var(--space-40) var(--space-24);
    font-size: 60px;
    letter-spacing: -2.2px;
  }
  .panel {
    grid-area: panel;
    min-height: 0;
    padding: var(--space-32) var(--space-32);
    display: flex;
    flex-direction: column;
    gap: var(--space-20);
  }
  [data-ratio="9x16"] .panel .hook,
  [data-ratio="4x5"] .panel .hook,
  [data-ratio="9x16"] .line,
  [data-ratio="4x5"] .line { display: none; }
  .line { font-size: 17px; line-height: 1.45; color: var(--color-muted); text-wrap: pretty; max-width: 32ch; }

  .sign {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-12);
    padding-top: var(--space-16);
    border-top: 1px solid var(--color-hairline);
  }
  .lockup { display: flex; align-items: center; gap: var(--space-12); }
  .lockup svg { width: 36px; height: 36px; flex: none; }
  .wordmark { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .byline { margin-top: var(--space-4); font-size: 13px; font-weight: 500; color: var(--color-muted); line-height: 1.2; }
  .tagline { font-size: 14px; font-weight: 600; line-height: 1.35; }
  .tagline .url { display: block; font-family: var(--font-mono); font-weight: 400; color: var(--color-muted); }
  [data-ratio="9x16"] .lockup svg { width: 44px; height: 44px; }
  [data-ratio="9x16"] .wordmark { font-size: 28px; }
  [data-ratio="9x16"] .byline { font-size: 14px; }
  [data-ratio="9x16"] .tagline { font-size: 18px; }

  /* 4:5 and 9:16: the meme fills the width, so the brand runs as one band beneath it */
  [data-ratio="4x5"] .panel { padding: 0 var(--space-24); justify-content: center; }
  [data-ratio="9x16"] .panel { padding: 0 var(--space-40); justify-content: center; }
  [data-ratio="4x5"] .sign,
  [data-ratio="9x16"] .sign {
    margin-top: 0;
    padding-top: 0;
    border-top: 0;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-16);
  }
  [data-ratio="4x5"] .lockup svg { width: 30px; height: 30px; }
  [data-ratio="4x5"] .wordmark { font-size: 21px; }
  [data-ratio="4x5"] .byline { display: none; }
  [data-ratio="4x5"] .tagline { font-size: 13px; text-align: right; }
  [data-ratio="9x16"] .lockup { flex: none; }
  [data-ratio="9x16"] .byline { white-space: nowrap; }
  [data-ratio="9x16"] .tagline { text-align: right; text-wrap: balance; }
</style>
</head>
<body>
<main class="ad">
  <h1 class="hook">Stop the leak on the push.</h1>

  <div class="meme">
    <img src="meme.jpg" width="1020" height="1144" alt="">
    <p class="caption">Flag critical security issues.</p>
  </div>

  <section class="panel">
    <h1 class="hook">Stop the leak on the push.</h1>
    <p class="line">pokayoke watches every push, runs an exploit against what it finds, and flags the critical issues before attackers do.</p>
    <footer class="sign">
      <div class="lockup">
        <svg viewBox="1 1 22 22" aria-hidden="true"><path d="M8.1 3.9A9 9 0 0 0 8.1 20.1M15.9 3.9A9 9 0 0 1 15.9 20.1" fill="none" stroke="#111212" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="12" r="3.5" fill="#0B59FE"/></svg>
        <div>
          <p class="wordmark">pokayoke</p>
          <p class="byline">by EZO Labs Security</p>
        </div>
      </div>
      <p class="tagline">Find exploits before attackers do.<span class="url">pokayoke.sh</span></p>
    </footer>
  </section>
</main>
</body>
</html>

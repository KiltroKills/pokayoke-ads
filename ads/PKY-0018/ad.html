<!doctype html>
<html lang="en" data-ratio="16x9">
<head>
<meta charset="utf-8">
<title>pokayoke ad PKY-0018</title>
<script>
  const ratio = new URLSearchParams(location.search).get('ratio');
  if (['16x9', '1x1', '4x5', '9x16'].includes(ratio)) document.documentElement.dataset.ratio = ratio;
</script>
<link rel="stylesheet" href="../../brand/tokens.css">
<!--
  Animated ad. Meme: "it's a vicious cycle" (r/ProgrammerHumor, u/Perfecto_24, 2022-12-27, 6.9k upvotes,
  i.redd.it/foqe2bvzbi8a1.gif): a white cartoon cat stops a drip on a pipe and starts a bigger leak each time,
  ending under a burst main. The GIF's caption bar ("FIXING BUGS IN YOUR CODE") is cropped off and the user's text,
  "Chat, no exploits pls.", takes its place above the cartoon; the pokayoke mark and wordmark sit bottom right.
  clip.mp4 is the GIF's cartoon area (640x352 from y=142, 150 frames at 70 ms) upscaled 4x with Real-ESRGAN
  (Upscayl's digital-art-4x model), its dark top edge trimmed (crop 2532x1392 at 14,8) and scaled to 1920x1056.
  `npm run render -- PKY-0018` writes <ratio>.png (the frame at data-poster-time) and <ratio>.mp4 (this page with
  clip.mp4 composited into the video's box by ffmpeg), so nothing may overlap the video's box.
  Layouts: the caption above the cartoon and the lockup under its right edge; 16:9 keeps the cartoon in a centred
  760px column, 1:1, 4:5 and 9:16 run it full width, 9:16 centred in the frame like a reel. In 1:1 the cartoon
  (540x297) sits at y 179, over a 64px lockup row, so its box stays on the 2x pixel grid.
-->
<style>
  :root { --frame-w: 960px; --frame-h: 540px; --clip-w: 760px; }
  [data-ratio="1x1"] { --frame-w: 540px; --frame-h: 540px; --clip-w: 540px; }
  [data-ratio="4x5"] { --frame-w: 540px; --frame-h: 675px; --clip-w: 540px; }
  [data-ratio="9x16"] { --frame-w: 540px; --frame-h: 960px; --clip-w: 540px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--color-surface); }
  body {
    width: var(--frame-w);
    height: var(--frame-h);
    font-family: var(--font-display);
    color: var(--color-ink);
    -webkit-font-smoothing: antialiased;
  }
  p { margin: 0; }

  .ad {
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: grid;
    grid-template-columns: var(--clip-w);
    grid-template-rows: minmax(0, 1fr) auto 48px;
    justify-content: center;
  }
  [data-ratio="1x1"] .ad { grid-template-rows: minmax(0, 1fr) auto 64px; }
  [data-ratio="4x5"] .ad { grid-template-rows: minmax(0, 1fr) auto 88px; }
  [data-ratio="9x16"] .ad { grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); }

  /* The caption: the meme's white bar, the user's line in place of the original */
  .caption {
    align-self: center;
    padding-inline: var(--space-24);
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.08;
    text-align: center;
    text-wrap: balance;
  }
  [data-ratio="1x1"] .caption { font-size: 48px; }
  [data-ratio="4x5"] .caption { font-size: 56px; }
  [data-ratio="9x16"] .caption { align-self: end; padding-bottom: var(--space-32); font-size: 60px; }

  /* The cartoon: 640:352, so a 760px column is 418px tall and a 540px one 297px */
  .clip {
    width: var(--clip-w);
    height: auto;
    aspect-ratio: 640 / 352;
    display: block;
    object-fit: cover;
    background: var(--color-ink);
  }

  /* The lockup, bottom right */
  .lockup {
    align-self: center;
    justify-self: end;
    display: flex;
    align-items: center;
    gap: var(--space-8);
  }
  .lockup svg { width: 28px; height: 28px; flex: none; }
  .wordmark { font-size: 21px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  [data-ratio="1x1"] .lockup { margin-right: var(--space-24); gap: var(--space-12); }
  [data-ratio="1x1"] .lockup svg { width: 32px; height: 32px; }
  [data-ratio="1x1"] .wordmark { font-size: 24px; }
  [data-ratio="4x5"] .lockup { margin-right: var(--space-24); gap: var(--space-12); }
  [data-ratio="4x5"] .lockup svg { width: 36px; height: 36px; }
  [data-ratio="4x5"] .wordmark { font-size: 27px; }
  /* 9:16: right under the cartoon, clear of the bottom band where Reels and TikTok lay their own UI */
  [data-ratio="9x16"] .lockup { align-self: start; margin: var(--space-24) var(--space-24) 0 0; gap: var(--space-12); }
  [data-ratio="9x16"] .lockup svg { width: 40px; height: 40px; }
  [data-ratio="9x16"] .wordmark { font-size: 30px; }
</style>
</head>
<body>
<main class="ad">
  <p class="caption">Chat, no exploits pls.</p>
  <video class="clip" src="clip.mp4" width="1920" height="1056" data-poster-time="9.45" autoplay muted loop playsinline aria-hidden="true"></video>
  <div class="lockup">
    <svg viewBox="1 1 22 22" aria-hidden="true"><path d="M8.1 3.9A9 9 0 0 0 8.1 20.1M15.9 3.9A9 9 0 0 1 15.9 20.1" fill="none" stroke="#111212" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="12" r="3.5" fill="#0B59FE"/></svg>
    <p class="wordmark">pokayoke</p>
  </div>
</main>
</body>
</html>

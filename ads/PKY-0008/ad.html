-->

  [data-ratio="1x1"] {

    --frame-h: 540px;

  [data-ratio="9x16"] {

    --frame-h: 960px;

    --mark: 34px;
    --wordmark: 21px;
    --byline: 12px;
    --url: 15px;
    --card-w: 468px;
    --card-pad: var(--space-40);
    --icon: 56px;
    --title: 36px;
    --code: 20px;
    --button: 20px;
    --pointer: 34px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--color-band); }
  body {
    width: var(--frame-w);
    height: var(--frame-h);
    font-family: var(--font-display);
    color: var(--color-on-ink);
    -webkit-font-smoothing: antialiased;
  }
  p { margin: 0; }

  .ad {
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }

  /* The site's top bar, dark */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-16) var(--bar-pad);
    border-bottom: 1px solid var(--color-band-hairline);
  }
  .lockup { display: flex; align-items: center; gap: var(--space-12); }
  .lockup svg { width: var(--mark); height: var(--mark); flex: none; }
  .wordmark { font-size: var(--wordmark); font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .byline { margin-top: var(--space-4); font-size: var(--byline); font-weight: 500; color: var(--color-band-muted); line-height: 1.2; }
  .url { font-family: var(--font-mono); font-size: var(--url); font-weight: 500; }

  .stage { min-height: 0; display: grid; place-items: center; }

  /* The agent card */
  .card {
    width: var(--card-w);
    padding: var(--card-pad);
    display: grid;
    gap: var(--space-20);
    background: var(--color-band-surface);
    border: 1px solid var(--color-band-accent-edge);
    border-radius: var(--radius-surface);
  }
  .icon { width: var(--icon); height: var(--icon); }
  .title { font-size: var(--title); font-weight: 800; letter-spacing: -0.025em; line-height: 1.2; }
  .code {
    padding: var(--space-12) var(--space-16);
    font-family: var(--font-mono);
    font-size: var(--code);
    line-height: 1.5;
    text-wrap: balance; /* no lone "bugs" on the last line */
    background: var(--color-band-surface);
    border: 1px solid var(--color-band-hairline-strong);
    border-radius: var(--radius-control);
  }
  .copy {
    position: relative;
    margin-top: calc(-1 * var(--space-4));
    padding: var(--space-12);
    text-align: center;
    font-size: var(--button);
    font-weight: 600;
    line-height: 1.2;
    color: var(--color-surface);
    background: var(--color-accent);
    border-radius: var(--radius-control);
  }
  .pointer {
    position: absolute;
    right: 22%;
    top: 55%;
    width: var(--pointer);
    height: var(--pointer);
  }
  .pointer path { fill: var(--color-surface); stroke: var(--color-ink); stroke-width: 1.5; stroke-linejoin: round; }
</style>

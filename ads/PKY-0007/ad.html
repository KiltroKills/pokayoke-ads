<!doctype html>
<html lang="en" data-ratio="16x9">
<head>
<meta charset="utf-8">
<title>pokayoke ad PKY-0007</title>
<script>
  // Rendered by scripts/render.mjs once per ratio: ?ratio=16x9 | 1x1 | 4x5 | 9x16
  const ratio = new URLSearchParams(location.search).get('ratio');
  if (['16x9', '1x1', '4x5', '9x16'].includes(ratio)) document.documentElement.dataset.ratio = ratio;
</script>
<link rel="stylesheet" href="../../brand/tokens.css">
<!--
  The pokayoke.sh hero, as an ad: the site's top bar, its headline and its three blue ticks, nothing else.
  Type follows the site: headline 800 at -0.035em, points 500 muted, tick = blue disc with a white check.
  16:9 headline left, ticks right (as on the site). 1:1, 4:5 and 9:16 stack them; 1:1 keeps the headline on its two site lines.
-->
<style>
  :root {
    --frame-w: 960px;
    --frame-h: 540px;
    --pad: var(--space-40);
    --bar-pad: var(--space-32);
    --mark: 32px;
    --wordmark: 20px;
    --byline: 12px;
    --url: 15px;
    --h1: 52px; /* two lines, as on the site: "Find exploits before / attackers do." */
    --point: 19px;
    --tick: 24px;
    --point-gap: var(--space-16);
  }
  [data-ratio="1x1"] {
    --frame-w: 540px;
    --frame-h: 540px;
    --pad: var(--space-32);
    --bar-pad: var(--space-24);
    --mark: 30px;
    --wordmark: 19px;
    --byline: 11px;
    --url: 14px;
    --h1: 52px;
    --point: 18px;
    --tick: 24px;
    --point-gap: var(--space-12);
  }
  [data-ratio="4x5"] {
    --frame-w: 540px;
    --frame-h: 675px;
    --pad: var(--space-40);
    --bar-pad: var(--space-24);
    --mark: 30px;
    --wordmark: 19px;
    --byline: 11px;
    --url: 14px;
    --h1: 60px;
    --point: 20px;
    --tick: 26px;
    --point-gap: var(--space-16);
  }
  [data-ratio="9x16"] {
    --frame-w: 540px;
    --frame-h: 960px;
    --pad: var(--space-40);
    --bar-pad: var(--space-24);
    --mark: 34px;
    --wordmark: 21px;
    --byline: 12px;
    --url: 15px;
    --h1: 72px;
    --point: 22px;
    --tick: 28px;
    --point-gap: var(--space-24);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--color-canvas); }
  body {
    width: var(--frame-w);
    height: var(--frame-h);
    font-family: var(--font-display);
    color: var(--color-ink);
    -webkit-font-smoothing: antialiased;
  }
  p, ul { margin: 0; padding: 0; }

  .ad {
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }

  /* The site's top bar: lockup left, a hairline under it */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-16) var(--bar-pad);
    border-bottom: 1px solid var(--color-hairline);
  }
  .lockup { display: flex; align-items: center; gap: var(--space-12); }
  .lockup svg { width: var(--mark); height: var(--mark); flex: none; }
  .wordmark { font-size: var(--wordmark); font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .byline { margin-top: var(--space-4); font-size: var(--byline); font-weight: 500; color: var(--color-muted); line-height: 1.2; }
  .url { font-family: var(--font-mono); font-size: var(--url); font-weight: 500; }

  /* The hero */
  .hero {
    min-height: 0;
    padding: var(--pad);
    display: grid;
    align-content: center;
    gap: var(--space-40);
  }
  [data-ratio="16x9"] .hero {
    grid-template-columns: auto auto;
    justify-content: space-between;
    align-items: center;
    column-gap: var(--space-40);
  }
  [data-ratio="16x9"] .title span,
  [data-ratio="1x1"] .title span { white-space: nowrap; }
  [data-ratio="1x1"] .hero { gap: var(--space-32); }
  [data-ratio="9x16"] .hero { gap: var(--space-48); }

  .title {
    font-size: var(--h1);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.04;
  }
  .title span { display: block; }

  .points {
    list-style: none;
    display: grid;
    gap: var(--point-gap);
    font-size: var(--point);
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.35;
    color: var(--color-muted);
  }
  .points li { display: flex; align-items: center; gap: var(--space-16); white-space: nowrap; }
  .tick { width: var(--tick); height: var(--tick); flex: none; color: var(--color-surface); }
  .tick circle { fill: var(--color-accent); }
</style>
</head>
<body>
<main class="ad">
  <header class="bar">
    <div class="lockup">
      <svg viewBox="1 1 22 22" aria-hidden="true"><path d="M8.1 3.9A9 9 0 0 0 8.1 20.1M15.9 3.9A9 9 0 0 1 15.9 20.1" fill="none" stroke="#111212" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="12" r="3.5" fill="#0B59FE"/></svg>
      <div>
        <p class="wordmark">pokayoke</p>
        <p class="byline">by EZO Labs Security</p>
      </div>
    </div>
    <p class="url">pokayoke.sh</p>
  </header>

  <section class="hero">
    <p class="title"><span>Find exploits before</span> <span>attackers do.</span></p>
    <ul class="points">
      <li><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12"/><path d="M20 6L9 17l-5-5" transform="translate(6 6) scale(0.5)" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>Watches every push with the GitHub App</li>
      <li><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12"/><path d="M20 6L9 17l-5-5" transform="translate(6 6) scale(0.5)" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>Marks each finding proven or not</li>
      <li><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12"/><path d="M20 6L9 17l-5-5" transform="translate(6 6) scale(0.5)" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>Sends the fix privately on paid plans</li>
    </ul>
  </section>
</main>
</body>
</html>

<!doctype html>
<html lang="en" data-ratio="16x9">
<head>
<meta charset="utf-8">
<title>pokayoke ad PKY-0013</title>
<script>
  const ratio = new URLSearchParams(location.search).get('ratio');
  if (['16x9', '4x5', '9x16'].includes(ratio)) document.documentElement.dataset.ratio = ratio;
</script>
<link rel="stylesheet" href="../../brand/tokens.css">
<!--
  Meme: the user's CCTV still (CAM 03, 2026-11-10) of a worker on a ledge whose harness is clipped to a hook held
  to the wall with clear tape, upscaled 2x to meme.jpg (1400x798). The user's text, "No exploits in my repo. Make no
  mistakes", is the caption above the photo, in quotes like a prompt, the second sentence on its own line (as in
  PKY-0006). The red ring marks the taped hook: the prompt is the tape. No headline: the meme carries the ad.
  Layouts: 16:9 meme left, panel right. 4:5 and 9:16 meme on top, then the line and a brand band.
-->
<style>
  :root { --frame-w: 960px; --frame-h: 540px; }
  [data-ratio="4x5"] { --frame-w: 540px; --frame-h: 675px; }
  [data-ratio="9x16"] { --frame-w: 540px; --frame-h: 960px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--color-canvas); }
  body {
    width: var(--frame-w);
    height: var(--frame-h);
    font-family: var(--font-display);
    color: var(--color-ink);
    -webkit-font-smoothing: antialiased;
  }
  p { margin: 0; }

  .ad {
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: grid;
    grid-template-columns: 660px minmax(0, 1fr);
    grid-template-rows: 100%;
    grid-template-areas: "meme panel";
  }
  [data-ratio="4x5"] .ad,
  [data-ratio="9x16"] .ad {
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "meme" "panel";
  }

  /* The meme: the quoted prompt above the photo, with a ring on the taped hook */
  .meme { grid-area: meme; display: flex; flex-direction: column; background: var(--color-surface); }
  [data-ratio="16x9"] .meme { border-right: 1px solid var(--color-hairline); }
  .caption {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: var(--space-24) var(--space-32);
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.12;
  }
  .caption span { display: block; }
  [data-ratio="4x5"] .caption { padding: var(--space-24); font-size: 32px; letter-spacing: -0.8px; }
  [data-ratio="9x16"] .caption { padding: var(--space-48) var(--space-32) var(--space-32); font-size: 54px; letter-spacing: -1.8px; }
  [data-ratio="9x16"] .caption span { text-wrap: balance; }

  .photo { position: relative; flex: none; line-height: 0; }
  .photo img { width: 100%; height: auto; display: block; }
  .ring {
    position: absolute;
    left: 0.6%;
    top: 46%;
    width: 24%;
    height: 43%;
    border: 3px solid var(--color-critical);
    border-radius: 50%;
    transform: rotate(-8deg);
  }

  /* The line and the lockup */
  .panel {
    grid-area: panel;
    min-height: 0;
    padding: var(--space-32) var(--space-24);
    display: flex;
    flex-direction: column;
    gap: var(--space-24);
  }
  .line {
    margin-block: auto;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.4px;
    line-height: 1.32;
    text-wrap: pretty;
  }
  [data-ratio="4x5"] .panel { padding: var(--space-20) var(--space-24) var(--space-24); gap: var(--space-16); }
  [data-ratio="4x5"] .line { font-size: 18px; letter-spacing: -0.2px; }
  [data-ratio="9x16"] .panel { padding: var(--space-32) var(--space-32) var(--space-40); }
  [data-ratio="9x16"] .line { font-size: 28px; letter-spacing: -0.6px; }

  .sign {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-12);
    padding-top: var(--space-16);
    border-top: 1px solid var(--color-hairline);
  }
  .lockup { display: flex; align-items: center; gap: var(--space-12); }
  .lockup svg { width: 36px; height: 36px; flex: none; }
  .wordmark { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .byline { margin-top: var(--space-4); font-size: 13px; font-weight: 500; color: var(--color-muted); line-height: 1.2; }
  .tagline { font-size: 14px; font-weight: 600; line-height: 1.35; }
  .tagline .url { display: block; font-family: var(--font-mono); font-weight: 400; color: var(--color-muted); }

  /* 4:5 and 9:16: the brand runs as one band under the line */
  [data-ratio="4x5"] .sign,
  [data-ratio="9x16"] .sign {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-16);
  }
  [data-ratio="4x5"] .lockup { flex: none; }
  [data-ratio="4x5"] .lockup svg { width: 30px; height: 30px; }
  [data-ratio="4x5"] .wordmark { font-size: 21px; }
  [data-ratio="4x5"] .byline { display: none; }
  [data-ratio="4x5"] .tagline { font-size: 13px; text-align: right; }
  [data-ratio="9x16"] .sign { padding-top: var(--space-24); }
  [data-ratio="9x16"] .lockup { flex: none; }
  [data-ratio="9x16"] .lockup svg { width: 44px; height: 44px; }
  [data-ratio="9x16"] .wordmark { font-size: 28px; }
  [data-ratio="9x16"] .byline { font-size: 14px; white-space: nowrap; }
  [data-ratio="9x16"] .tagline { font-size: 18px; text-align: right; text-wrap: balance; }
</style>
</head>
<body>
<main class="ad">
  <div class="meme">
    <p class="caption"><span>“No exploits in my repo.</span><span>Make no mistakes.”</span></p>
    <div class="photo">
      <img src="meme.jpg" width="1400" height="798" alt="">
      <span class="ring" aria-hidden="true"></span>
    </div>
  </div>

  <section class="panel">
    <p class="line">A prompt isn't a safety line. pokayoke attacks every push and runs an exploit against what it finds.</p>
    <footer class="sign">
      <div class="lockup">
        <svg viewBox="1 1 22 22" aria-hidden="true"><path d="M8.1 3.9A9 9 0 0 0 8.1 20.1M15.9 3.9A9 9 0 0 1 15.9 20.1" fill="none" stroke="#111212" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="12" r="3.5" fill="#0B59FE"/></svg>
        <div>
          <p class="wordmark">pokayoke</p>
          <p class="byline">by EZO Labs Security</p>
        </div>
      </div>
      <p class="tagline">Find exploits before attackers do.<span class="url">pokayoke.sh</span></p>
    </footer>
  </section>
</main>
</body>
</html>

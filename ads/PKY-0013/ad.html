<!doctype html>
<html lang="en" data-ratio="16x9">
<head>
<meta charset="utf-8">
<title>pokayoke ad PKY-0013</title>
<script>
  const ratio = new URLSearchParams(location.search).get('ratio');
  if (['16x9', '1x1', '4x5', '9x16'].includes(ratio)) document.documentElement.dataset.ratio = ratio;
</script>
<link rel="stylesheet" href="../../brand/tokens.css">
<!--
  Meme: the user's CCTV still (CAM 03, 2026-11-10) of a worker on a ledge whose harness is clipped to a hook held
  to the wall with clear tape, trimmed of its dark top and bottom rows and upscaled 2x to meme.jpg (1400x792). The user's text, "No exploits in my repo. Make no
  mistakes", is the caption, in quotes like a prompt. The red ring marks the taped hook: the prompt is the tape.
  The only branding is the lockup, overlaid bottom-left on the photo (the user's ask). The hook fills the photo's
  lower left (x 3-22%, y 49-85%), so the lockup sits on the wall below it (y over 86%) and never covers it.
  Layouts: 16:9 the whole photo, the caption on a plate over the blank wall top-left.
           1:1, 4:5 and 9:16 the caption above, then the photo cropped on the right (city view) to 1.45:1; a square
           crop cannot hold both the hook and the worker, so 1:1 keeps that crop and sets the caption in two lines.
-->
<style>
  :root { --frame-w: 960px; --frame-h: 540px; }
  [data-ratio="1x1"] { --frame-w: 540px; --frame-h: 540px; }
  [data-ratio="4x5"] { --frame-w: 540px; --frame-h: 675px; }
  [data-ratio="9x16"] { --frame-w: 540px; --frame-h: 960px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--color-canvas); }
  body {
    width: var(--frame-w);
    height: var(--frame-h);
    font-family: var(--font-display);
    color: var(--color-ink);
    -webkit-font-smoothing: antialiased;
  }
  p { margin: 0; }

  .ad { width: 100%; height: 100%; overflow: hidden; background: var(--color-surface); }
  .meme { position: relative; height: 100%; display: flex; flex-direction: column; }

  /* The caption: above the photo in the tall frames, a plate over the wall in 16:9 */
  .caption {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: var(--space-24) var(--space-32);
    font-size: 54px;
    font-weight: 800;
    letter-spacing: -1.8px;
    line-height: 1.08;
  }
  .caption span { display: block; text-wrap: balance; }
  [data-ratio="1x1"] .caption { font-size: 42px; letter-spacing: -1.4px; }
  [data-ratio="9x16"] .caption { padding: var(--space-48) var(--space-32); font-size: 70px; letter-spacing: -2.6px; }
  [data-ratio="16x9"] .caption {
    position: absolute;
    z-index: 1;
    left: 2.6%;
    top: 9%;
    max-width: 39%;
    padding: var(--space-16) var(--space-20);
    background: var(--color-surface);
    border-radius: var(--radius-control);
    font-size: 32px;
    letter-spacing: -0.9px;
  }

  /* The photo, with the ring on the taped hook and the lockup on the wall below it */
  .photo { position: relative; flex: none; line-height: 0; }
  [data-ratio="16x9"] .photo { flex: 1; min-height: 0; }
  .frame { position: relative; height: 100%; }
  .frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
  /* 1:1 and the tall frames show x 0 to 83% of the still (1160 of 1400 px): hook to worker, the city view cut */
  [data-ratio="1x1"] .frame img,
  [data-ratio="4x5"] .frame img,
  [data-ratio="9x16"] .frame img { height: auto; aspect-ratio: 1160 / 792; object-position: left center; }
  .ring {
    position: absolute;
    left: 0.6%;
    top: 46%;
    width: 24%;
    height: 42%;
    border: 3px solid var(--color-critical);
    border-radius: 50%;
    transform: rotate(-8deg);
  }
  [data-ratio="1x1"] .ring,
  [data-ratio="4x5"] .ring,
  [data-ratio="9x16"] .ring { left: 0.8%; width: 29%; height: 39.5%; }

  .lockup {
    position: absolute;
    left: var(--space-12);
    bottom: var(--space-12);
    display: flex;
    align-items: center;
    gap: var(--space-12);
    padding: var(--space-8) var(--space-16) var(--space-8) var(--space-12);
    background: var(--color-canvas);
    border-radius: var(--radius-control);
    line-height: normal;
  }
  .lockup svg { width: 32px; height: 32px; flex: none; }
  .wordmark { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .byline { margin-top: var(--space-2); font-size: 12px; font-weight: 500; color: var(--color-muted); line-height: 1.2; }
  [data-ratio="1x1"] .lockup,
  [data-ratio="4x5"] .lockup,
  [data-ratio="9x16"] .lockup {
    left: var(--space-6);
    bottom: var(--space-6);
    gap: var(--space-8);
    padding: var(--space-6) var(--space-12) var(--space-6) var(--space-8);
  }
  [data-ratio="1x1"] .lockup svg,
  [data-ratio="4x5"] .lockup svg,
  [data-ratio="9x16"] .lockup svg { width: 28px; height: 28px; }
  [data-ratio="1x1"] .wordmark,
  [data-ratio="4x5"] .wordmark,
  [data-ratio="9x16"] .wordmark { font-size: 19px; }
  [data-ratio="1x1"] .byline,
  [data-ratio="4x5"] .byline,
  [data-ratio="9x16"] .byline { margin-top: var(--space-2); font-size: 11px; }
</style>
</head>
<body>
<main class="ad">
  <div class="meme">
  <p class="caption"><span>“No exploits in my repo.</span><span>Make no mistakes.”</span></p>
  <div class="photo">
    <div class="frame">
      <img src="meme.jpg" width="1400" height="792" alt="">
      <span class="ring" aria-hidden="true"></span>
    </div>
    <div class="lockup">
      <svg viewBox="1 1 22 22" aria-hidden="true"><path d="M8.1 3.9A9 9 0 0 0 8.1 20.1M15.9 3.9A9 9 0 0 1 15.9 20.1" fill="none" stroke="#111212" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="12" r="3.5" fill="#0B59FE"/></svg>
      <div>
        <p class="wordmark">pokayoke</p>
        <p class="byline">by EZO Labs Security</p>
      </div>
    </div>
  </div>
  </div>
</main>
</body>
</html>

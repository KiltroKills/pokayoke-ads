<!doctype html>
<html lang="en" data-ratio="16x9">
<head>
<meta charset="utf-8">
<title>pokayoke ad PKY-0015</title>
<script>
  // Rendered by scripts/render.mjs once per ratio: ?ratio=16x9 | 4x5 | 9x16
  const ratio = new URLSearchParams(location.search).get('ratio');
  if (['16x9', '4x5', '9x16'].includes(ratio)) document.documentElement.dataset.ratio = ratio;
</script>
<link rel="stylesheet" href="../../brand/tokens.css">
<!--
  Meme: "Terminator robots invading" (imgflip template 530426257), the future-war shot of T-800 endoskeletons
  marching through blue smoke with miniguns, from the 1777x920 copy the user sent, upscaled 2x to still.jpg (3554x1840).
  Rights: a Terminator film still (meme bank MEME-59, "Ask first or skip"): not for paid ads unless licensed.
  The only text is "Stay Safe.", as the user asked, and the pokayoke lockup (mark and wordmark) top right,
  their later ask; no byline, no tagline.
  The still fills the frame in every ratio; --fx/--fy pick the crop (0 = left/top edge, 1 = right/bottom edge),
  and --view (object-view-box) trims the still first where the lockup would cover a robot.
  PKY-0015 to PKY-0017 are the same ad over the three images the user sent.
-->
<style>
  :root {
    --frame-w: 960px;
    --frame-h: 540px;
    --fx: 1;
    --fy: 0;
    /* 16:9 only: view the top-right 88% of the still, so the front robot's head clears the lockup */
    --view: inset(0 0 12% 12%);
    --size: 12cqw;
    --bottom: 7cqh;
    --lockup-top: var(--space-20);
    --lockup-right: var(--space-20);
  }
  [data-ratio="4x5"] {
    --frame-w: 540px;
    --frame-h: 675px;
    --fx: 0.24;
    --fy: 0.35;
    --view: none;
    --size: 15cqw;
    --lockup-top: var(--space-16);
    --lockup-right: var(--space-16);
  }
  [data-ratio="9x16"] {
    --frame-w: 540px;
    --frame-h: 960px;
    --fx: 0.2;
    --fy: 0.35;
    --view: none;
    --size: 15cqw;
    --bottom: 22cqh; /* above the reply bar and captions that Stories and Reels lay over the bottom */
    --lockup-top: 14cqh; /* below the profile bar and close button Stories lay over the top */
    --lockup-right: var(--space-16);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--color-ink); }
  body {
    width: var(--frame-w);
    height: var(--frame-h);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }
  p { margin: 0; }

  .ad { width: 100%; height: 100%; overflow: hidden; }

  /* The still, the one line of text over it, and the lockup */
  .shot { position: relative; width: 100%; height: 100%; overflow: hidden; container-type: size; background: var(--color-ink); }
  .shot img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: calc(var(--fx) * 100%) calc(var(--fy) * 100%);
    object-view-box: var(--view);
  }
  .caption {
    position: absolute;
    left: 50%;
    bottom: var(--bottom);
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: var(--size);
    font-weight: 900;
    letter-spacing: 0.02em;
    line-height: 1.04;
    color: var(--color-surface);
    -webkit-text-stroke: calc(var(--size) * 0.12) var(--color-ink);
    paint-order: stroke fill;
    text-shadow: 0 0.4cqw 1.6cqw color-mix(in srgb, var(--color-ink) 55%, transparent);
  }

  /* The pokayoke lockup, top right, on a canvas chip so it reads over any still (as on PKY-0013) */
  .lockup {
    position: absolute;
    top: var(--lockup-top);
    right: var(--lockup-right);
    display: flex;
    align-items: center;
    gap: var(--space-12);
    padding: var(--space-8) var(--space-16) var(--space-8) var(--space-12);
    background: var(--color-canvas);
    border-radius: var(--radius-control);
    box-shadow: 0 2px 12px color-mix(in srgb, var(--color-ink) 35%, transparent);
  }
  .lockup svg { width: 32px; height: 32px; flex: none; }
  .wordmark { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--color-ink); }
  [data-ratio="4x5"] .lockup,
  [data-ratio="9x16"] .lockup { gap: var(--space-8); padding: var(--space-6) var(--space-12) var(--space-6) var(--space-8); }
  [data-ratio="4x5"] .lockup svg,
  [data-ratio="9x16"] .lockup svg { width: 28px; height: 28px; }
  [data-ratio="4x5"] .wordmark,
  [data-ratio="9x16"] .wordmark { font-size: 21px; }
</style>
</head>
<body>
<main class="ad">
  <div class="shot">
    <img src="still.jpg" width="3554" height="1840" alt="">
    <p class="caption">Stay Safe.</p>
    <div class="lockup">
      <svg viewBox="1 1 22 22" aria-hidden="true"><path d="M8.1 3.9A9 9 0 0 0 8.1 20.1M15.9 3.9A9 9 0 0 1 15.9 20.1" fill="none" stroke="#111212" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="12" r="3.5" fill="#0B59FE"/></svg>
      <p class="wordmark">pokayoke</p>
    </div>
  </div>
</main>
</body>
</html>
